[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xblock-free-text-response"
dynamic = ["version"]
description = "A configurable, open text-type response"
readme = "README.rst"
license = "AGPL-3.0"
license-files = ["LICENSE"]
authors = [
    {name = "stv", email = "stv@stanford.edu"},
]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "six",
    "xblock",
]

[project.urls]
Homepage = "https://github.com/Stanford-Online/xblock-free-text-response"

[project.entry-points."xblock.v1"]
freetextresponse = "freetextresponse.xblocks:FreeTextResponse"

[tool.setuptools.packages.find]
where = ["src"]
include = ["freetextresponse*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
# Dummy version number for when .git isn't accessible.
# This happens, for example, when bind-mounting into a Docker image.
fallback_version = "0.0.0.dev0"

[tool.uv]
package = true
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
    ],
]

#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "lxml<5.0.0",
]
[tool.edx_lint]
uv_constraints = []

[dependency-groups]
test-base = [
    "coverage",
    "ddt",
    "django-pyfs",
    "edx-i18n-tools",
    "edx-opaque-keys",
    "lazy",
    "mock",
    "xblock-sdk",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "pycodestyle",
    "pylint",
]
ci = [
    "tox",
    "tox-uv>=1",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
]

[tool.coverage.run]
branch = true
source_pkgs = ["freetextresponse"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/settings.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.semantic_release]
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
